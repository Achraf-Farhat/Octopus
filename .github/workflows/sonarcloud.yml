name: SonarCloud Code Analysis

on:
  push:
    branches: [ main ]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  sonarcloud:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis

      # 1. Set up Python and run backend tests
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Run Backend Tests & Generate Coverage
        env:
          DATABASE_URL: "sqlite:///:memory:"
          REDIS_URL: "redis://localhost:6379/0"
          SECRET_KEY: "test_secret_key"
        run: |
          cd backend
          pytest --cov=app --cov-report=xml:coverage.xml
          # Fix coverage source path to align with repository root
          sed -i "s|<source>.*</source>|<source>$GITHUB_WORKSPACE</source>|g" coverage.xml
          # Prefix filenames to match the repository root structure
          sed -i 's|filename="|filename="backend/app/|g' coverage.xml

      # 2. Set up Node and run frontend tests
      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Run Frontend Tests & Generate Coverage
        run: |
          cd frontend
          npm run coverage
          # Adjust source file paths inside lcov.info to be relative to the repository root
          sed -i 's/SF:/SF:frontend\//g' coverage/lcov.info

      # 3. Trigger SonarCloud Scan
      - name: SonarCloud Scan
        uses: sonarsource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Achraf-Farhat_Octopus
            -Dsonar.organization=achraf-farhat
            -Dsonar.sources=backend/app,frontend/src
            -Dsonar.tests=backend/tests,frontend/src/tests
            -Dsonar.exclusions=**/node_modules/**,**/migrations/**,**/__pycache__/**,**/*.test.jsx,**/*.spec.jsx,frontend/src/tests/**
            -Dsonar.python.coverage.reportPaths=backend/coverage.xml
            -Dsonar.javascript.lcov.reportPaths=frontend/coverage/lcov.info
