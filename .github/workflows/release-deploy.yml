name: Build and Deploy to Production

on:
  push:
    branches: [ main ]

jobs:
  build-and-push:
    name: Build, Scan & Publish Images
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      # 1. Setup Docker Buildx for optimization & caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      # 2. Authenticate to GitHub Container Registry (GHCR)
      - name: Log in to GHCR
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. Build backend image and load locally to check
      - name: Build Backend Image
        uses: docker/build-push-action@v4
        with:
          context: ./backend
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 4. Scan backend image with Trivy (fails on critical vulnerabilities)
      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/backend:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      # 5. Build frontend image and load locally to check
      - name: Build Frontend Image
        uses: docker/build-push-action@v4
        with:
          context: ./frontend
          push: false
          load: true
          tags: ghcr.io/${{ github.repository }}/frontend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # 6. Scan frontend image with Trivy (fails on critical vulnerabilities)
      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ghcr.io/${{ github.repository }}/frontend:latest
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL'

      # 7. Push both images to GHCR (if scans pass successfully)
      - name: Push Images to GHCR
        run: |
          docker push ghcr.io/${{ github.repository }}/backend:latest
          docker push ghcr.io/${{ github.repository }}/frontend:latest

  deploy:
    name: Continuous Deployment (CD)
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      # 8. Log into remote server via SSH, pull updated registry images, and reload containers
      - name: Remote Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd /home/achraf/Octopus
            docker compose pull
            docker compose up -d --remove-orphans
